name: dockerBuildAndPush
description: Build and push Docker image (intent mode, no execution)
inputs:
  appName:
    description: Application name
    required: true
  registry:
    description: Docker registry
    required: true
  tag:
    description: Image tag
    required: true
runs:
  using: composite
  steps:
    - name: Intent - Build and push Docker image
      run: echo "INTENT: Build and push Docker image"
      shell: bash
    - name: Show application name
      run: echo "Application name: ${{ inputs.appName }}"
      shell: bash
    - name: Show Docker registry
      run: echo "Docker registry: ${{ inputs.registry }}"
      shell: bash
    - name: Show image tag
      run: echo "Image tag: ${{ inputs.tag }}"
      shell: bash
    - name: Note - Docker execution skipped
      run: echo "NOTE: Docker execution skipped (Windows-safe intent mode)"
      shell: bash
